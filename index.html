<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高屏・南迴・花蓮 3日懶人包</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=itinerary-20260926">
</head>
<body>
<nav class="stickynav" id="stickynav" aria-label="快速導覽"><div id="stickylinks"></div></nav>
<div class="wrap">
  <section class="hero" id="top">
    <div class="hero-top">
      <div class="badge" id="badge"></div>
      <h1 id="title"></h1>
      <nav class="quicknav" id="quicknav">
        <a href="#map">🗺️ 路線</a><a href="#plan">🗓️ 行程</a><a href="#transit">🚆 交通</a><a href="#stay">🏨 住宿</a>
      </nav>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="map">
    <div class="sec-head"><span>🗺️</span><h2>每日路線</h2><i></i></div>
    <div class="card overview"><div id="overview"></div><div class="overview-cap">每天去哪裡，一眼看懂</div></div>
  </section>

  <section id="plan">
    <div class="sec-head"><span>🗓️</span><h2>三天行程</h2><i></i></div>
    <div class="tabs" id="tabs"></div>
    <div class="route-line"><span id="route"></span><span class="sync" id="sync"></span></div>
    <a class="day-route" id="dayRoute" target="_blank" rel="noopener noreferrer"></a>
    <div id="hints"></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="transit">
    <div class="sec-head"><span>🚆</span><h2>交通攻略</h2><i></i></div>
    <p class="note">以下為原訂交通備忘；臨時調整請以「三天行程」為準。</p>
    <div class="tip"><span>🎯</span><p id="transitTip"></p></div>
    <div class="table" id="transitTable"></div>
    <div class="note" id="transitNote"></div>
  </section>

  <section id="stay">
    <div class="sec-head"><span>🏨</span><h2>住宿</h2><i></i></div>
    <div id="stays" style="display:flex;flex-direction:column;gap:18px"></div>
  </section>

  <footer id="footer"></footer>
</div>
<script src="data.js?v=trip-review-20260926"></script>
