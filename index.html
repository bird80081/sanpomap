<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高屏・南迴・花蓮 3日懶人包</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=icons-20260927">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 通用線條圖示（自繪，24×24、線寬 2、圓角）；美食與景點等專屬圖示另行處理 -->
  <symbol id="i-train" viewBox="0 0 24 24"><rect x="5.5" y="3" width="13" height="14" rx="3"/><path d="M5.5 10h13"/><circle class="dot" cx="9" cy="13.5" r="1"/><circle class="dot" cx="15" cy="13.5" r="1"/><path d="M8.5 17 6 21M15.5 17 18 21M7.2 19.5h9.6"/></symbol>
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M4.6 15H3v-3.8l2-4.7A2 2 0 0 1 6.8 5.3h10.4a2 2 0 0 1 1.8 1.2l2 4.7V15h-1.6M9.4 15h5.2M3 11h18M9 5.3 8.2 11M15 5.3l.8 5.7"/><circle cx="7" cy="16" r="2.3"/><circle cx="17" cy="16" r="2.3"/></symbol>
  <symbol id="i-bed" viewBox="0 0 24 24"><path d="M3 5.5V19M21 19v-6H3M3 16.5h18M10 13v-2.5a1.5 1.5 0 0 1 1.5-1.5h6.5a3 3 0 0 1 3 3v1"/><rect x="5" y="9.5" width="3.5" height="3.5" rx="1.2"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M4 6h16a1 1 0 0 1 1 1v3a2 2 0 0 0 0 4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a2 2 0 0 0 0-4V7a1 1 0 0 1 1-1z"/><path d="M15 6.5v11" stroke-dasharray="2 2.4"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><rect x="6" y="7" width="12" height="12.5" rx="2.2"/><path d="M9.5 7V4.8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1V7M10 10.5v5.5M14 10.5v5.5M8.5 19.5v1.2M15.5 19.5v1.2"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle class="dot" cx="8" cy="14.5" r="1"/><circle class="dot" cx="12" cy="14.5" r="1"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5 9 4.5l6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5a6 6 0 0 1 12 0"/><circle cx="16.8" cy="9" r="2.6"/><path d="M15.5 14.1a4.8 4.8 0 0 1 5.5 4.9"/></symbol>
</svg>
<nav class="stickynav" id="stickynav" aria-label="快速導覽"><div id="stickylinks"></div></nav>
<div class="wrap">
  <section class="hero" id="top">
    <div class="hero-top">
      <div class="badge" id="badge"></div>
      <h1 id="title"></h1>
      <nav class="quicknav" id="quicknav">
        <a href="#map"><svg class="ico"><use href="#i-map"/></svg>路線</a><a href="#plan"><svg class="ico"><use href="#i-cal"/></svg>行程</a><a href="#tickets"><svg class="ico"><use href="#i-ticket"/></svg>票券</a><a href="#stay"><svg class="ico"><use href="#i-bed"/></svg>住宿</a>
      </nav>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <details class="prep" id="prep"></details>

  <section id="map">
    <div class="sec-head"><span><svg class="ico"><use href="#i-map"/></svg></span><h2>每日路線</h2><i></i></div>
    <div class="card overview"><div id="overview"></div><div class="overview-cap">每天去哪裡，一眼看懂</div></div>
  </section>

  <section id="plan">
    <div class="sec-head"><span><svg class="ico"><use href="#i-cal"/></svg></span><h2>三天行程</h2><i></i></div>
    <div class="tabs" id="tabs"></div>
    <div class="route-line"><span id="route"></span><span class="sync" id="sync"></span></div>
    <a class="day-route" id="dayRoute" target="_blank" rel="noopener noreferrer"></a>
    <div id="hints"></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="tickets">
    <div class="sec-head"><span><svg class="ico"><use href="#i-ticket"/></svg></span><h2>票券</h2><i></i></div>
    <div class="tip"><span>🎯</span><p id="ticketTip"></p></div>
    <div class="table" id="ticketTable"></div>
    <p class="note" id="ticketNote"></p>
  </section>

  <section id="stay">
    <div class="sec-head"><span><svg class="ico"><use href="#i-bed"/></svg></span><h2>住宿</h2><i></i></div>
    <div id="stays" style="display:flex;flex-direction:column;gap:18px"></div>
  </section>

  <footer id="footer"></footer>
  <button class="backup-btn" id="printBtn">📄 存成 PDF（離線備份）</button>
</div>
<div id="printAll" class="print-only"></div>
<script src="data.js?v=icons-20260927"></script>
<script src="app.js?v=icons-20260927"></script>
</body>
</html>
